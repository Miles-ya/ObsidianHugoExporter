name: Release plugin

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run lint
          npm test
          npm run build

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const manifest=require('./manifest.json'); if (manifest.version !== process.env.RELEASE_TAG) { throw new Error('Tag must match manifest version'); }"

      - name: Prepare release assets
        run: |
          mkdir release
          cp main.js manifest.json release/
          if [ -f styles.css ]; then cp styles.css release/; fi

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const fs=require('fs'); const version=process.env.RELEASE_TAG; const changelog=fs.readFileSync('CHANGELOG.md','utf8'); const marker='## '+version+' - '; const start=changelog.indexOf(marker); if(start<0) throw new Error('Missing changelog section for '+version); const next=changelog.indexOf('\n## ',start+marker.length); fs.writeFileSync('release-notes.md',changelog.slice(start,next<0?undefined:next).trim()+'\n');"

      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: release/*
